<svg xmlns="http://www.w3.org/2000/svg" width="900" height="72" viewBox="0 0 900 72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><style>
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes growY{from{transform:scaleY(0)}to{transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{stroke-opacity:.15}50%{stroke-opacity:1}}
.c{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.bu{transform-box:fill-box;transform-origin:50% 100%;animation:growY .7s cubic-bezier(.2,.8,.2,1) both}
.bd{transform-box:fill-box;transform-origin:50% 0;animation:growY .7s cubic-bezier(.2,.8,.2,1) both}
.bx{transform-box:fill-box;transform-origin:0 50%;animation:growX .8s cubic-bezier(.2,.8,.2,1) both}
.r{animation:rise .6s ease-out both}
.now{fill:none;stroke:#e6edf3;stroke-width:1.5;animation:pulse 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><path d="M.5 72 V0 H899.5 V72 Z" fill="#0d1117"/><path d="M.5 0 V72M899.5 0 V72" stroke="#30363d" fill="none"/><line x1="22" x2="878" y1="71.5" y2="71.5" stroke="#30363d" stroke-dasharray="2 4"/><g class="r" style="animation-delay:0.35000000000000003s"><clipPath id="k"><rect x="24" y="10" width="52" height="52" rx="9"/></clipPath><image href="data:image/jpeg;base64," x="24" y="10" width="52" height="52" clip-path="url(#k)" preserveAspectRatio="xMidYMid slice"/><text x="90" y="33" fill="#e6edf3" font-size="15" font-weight="600">Say Yes To Heaven - Anyma Remix</text><text x="90" y="52" fill="#8b949e" font-size="12.5">Lana Del Rey, Anyma</text><text x="874" y="40" fill="#6e7681" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" text-anchor="end">Nov 5, 19:52</text></g></svg>