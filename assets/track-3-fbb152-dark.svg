<svg xmlns="http://www.w3.org/2000/svg" width="900" height="80" viewBox="0 0 900 80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><style>
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes growY{from{transform:scaleY(0)}to{transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{stroke-opacity:.15}50%{stroke-opacity:1}}
.c{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.bu{transform-box:fill-box;transform-origin:50% 100%;animation:growY .7s cubic-bezier(.2,.8,.2,1) both}
.bd{transform-box:fill-box;transform-origin:50% 0;animation:growY .7s cubic-bezier(.2,.8,.2,1) both}
.bx{transform-box:fill-box;transform-origin:0 50%;animation:growX .8s cubic-bezier(.2,.8,.2,1) both}
.r{animation:rise .6s ease-out both}
.now{fill:none;stroke:#e6edf3;stroke-width:1.5;animation:pulse 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x=".5" y=".5" width="899" height="79" rx="14" fill="#0d1117" stroke="#30363d"/><g class="r" style="animation-delay:0.21000000000000002s"><clipPath id="k"><rect x="14" y="14" width="52" height="52" rx="9"/></clipPath><image href="data:image/jpeg;base64," x="14" y="14" width="52" height="52" clip-path="url(#k)" preserveAspectRatio="xMidYMid slice"/><text x="80" y="38" fill="#e6edf3" font-size="15" font-weight="600">Beside Of Me</text><text x="80" y="58" fill="#8b949e" font-size="12.5">nimino, Maverick Sabre</text><text x="878" y="45" fill="#6e7681" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" text-anchor="end">Oct 29, 11:56</text></g></svg>