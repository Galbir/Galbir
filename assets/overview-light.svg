<svg xmlns="http://www.w3.org/2000/svg" width="900" height="248" viewBox="0 0 900 248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><style>
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes growY{from{transform:scaleY(0)}to{transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{stroke-opacity:.15}50%{stroke-opacity:1}}
.c{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.bu{transform-box:fill-box;transform-origin:50% 100%;animation:growY .7s cubic-bezier(.2,.8,.2,1) both}
.bd{transform-box:fill-box;transform-origin:50% 0;animation:growY .7s cubic-bezier(.2,.8,.2,1) both}
.bx{transform-box:fill-box;transform-origin:0 50%;animation:growX .8s cubic-bezier(.2,.8,.2,1) both}
.r{animation:rise .6s ease-out both}
.now{fill:none;stroke:#1f2328;stroke-width:1.5;animation:pulse 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="899" height="247" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<text class="r" x="32" y="42" fill="#1f2328" font-size="18" font-weight="600">Overview</text><text class="r" x="32" y="64" fill="#59636e" font-size="12.5" style="animation-delay:.1s">Last 12 months · lines exclude lockfiles and generated files · all-time totals underneath</text><g class="r" style="animation-delay:0s"><text x="32" y="104" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="600">1,483</text><text x="32" y="124" fill="#59636e" font-size="10" letter-spacing=".08em" text-anchor="start">COMMITS</text><text x="32" y="140" fill="#818b98" font-size="10" letter-spacing=".08em" text-anchor="start">ALL TIME 1,493</text></g><g class="r" style="animation-delay:0.07s"><text x="241" y="104" fill="#1a7f37" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="600">+887,280</text><text x="241" y="124" fill="#59636e" font-size="10" letter-spacing=".08em" text-anchor="start">LINES ADDED</text><text x="241" y="140" fill="#818b98" font-size="10" letter-spacing=".08em" text-anchor="start">ALL TIME +896.1k</text></g><g class="r" style="animation-delay:0.14s"><text x="450" y="104" fill="#cf222e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="600">−620,663</text><text x="450" y="124" fill="#59636e" font-size="10" letter-spacing=".08em" text-anchor="start">LINES REMOVED</text><text x="450" y="140" fill="#818b98" font-size="10" letter-spacing=".08em" text-anchor="start">ALL TIME −620.7k</text></g><g class="r" style="animation-delay:0.21000000000000002s"><text x="659" y="104" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="600">+266.6k</text><text x="659" y="124" fill="#59636e" font-size="10" letter-spacing=".08em" text-anchor="start">NET LINES</text><text x="659" y="140" fill="#818b98" font-size="10" letter-spacing=".08em" text-anchor="start">ALL TIME +275.4k</text></g>
