<path d="M10.4 18.8c4.8-1.4 10.3-.8 14.7 1.8" stroke="#000" stroke-width="2.2" fill="none" stroke-linecap="round"/>
<path d="M11.4 23.2c3.9-1.1 8-.6 11.5 1.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/></g></g><text class="r" x="72" y="33" fill="#1f2328" font-size="17" font-weight="600">Recently played</text><text class="r" x="72" y="51" fill="#59636e" font-size="12" style="animation-delay:.1s">last tracks on Spotify · updates every 30 minutes</text></svg>