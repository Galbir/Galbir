<svg xmlns="http://www.w3.org/2000/svg" width="900" height="334" viewBox="0 0 900 334" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><style>
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes growY{from{transform:scaleY(0)}to{transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{stroke-opacity:.15}50%{stroke-opacity:1}}
.c{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.bu{transform-box:fill-box;transform-origin:50% 100%;animation:growY .7s cubic-bezier(.2,.8,.2,1) both}
.bd{transform-box:fill-box;transform-origin:50% 0;animation:growY .7s cubic-bezier(.2,.8,.2,1) both}
.bx{transform-box:fill-box;transform-origin:0 50%;animation:growX .8s cubic-bezier(.2,.8,.2,1) both}
.r{animation:rise .6s ease-out both}
.now{fill:none;stroke:#e6edf3;stroke-width:1.5;animation:pulse 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="899" height="333" rx="14" fill="#0d1117" stroke="#30363d"/>
<text class="r" x="32" y="42" fill="#e6edf3" font-size="18" font-weight="600">Highlights &amp; records</text><text class="r" x="32" y="64" fill="#8b949e" font-size="12.5" style="animation-delay:.1s">Last 12 months</text><g class="r" style="animation-delay:0.1s"><circle cx="38" cy="96" r="3" fill="#26a641"/><text x="52" y="100" fill="#8b949e" font-size="13">Most commits happen in the <tspan fill="#e6edf3" font-weight="600">daytime</tspan> (44%), peaking around <tspan fill="#e6edf3" font-weight="600">18:00</tspan>.</text></g><g class="r" style="animation-delay:0.18s"><circle cx="38" cy="122" r="3" fill="#26a641"/><text x="52" y="126" fill="#8b949e" font-size="13">Busiest weekday is <tspan fill="#e6edf3" font-weight="600">Tuesday</tspan>.</text></g><g class="r" style="animation-delay:0.26s"><circle cx="38" cy="148" r="3" fill="#26a641"/><text x="52" y="152" fill="#8b949e" font-size="13"><tspan fill="#e6edf3" font-weight="600">10%</tspan> of commits land between 22:00 and 05:00.</text></g><g class="r" style="animation-delay:0.33999999999999997s"><circle cx="38" cy="174" r="3" fill="#26a641"/><text x="52" y="178" fill="#8b949e" font-size="13">A typical active day has <tspan fill="#e6edf3" font-weight="600">9.1</tspan> commits across <tspan fill="#e6edf3" font-weight="600">3.0 h</tspan>.</text></g><g class="r" style="animation-delay:0.42000000000000004s"><circle cx="38" cy="200" r="3" fill="#26a641"/><text x="52" y="204" fill="#8b949e" font-size="13">Biggest month: <tspan fill="#e6edf3" font-weight="600">October 2026</tspan> with <tspan fill="#e6edf3" font-weight="600">402</tspan> commits.</text></g>
<line x1="32" x2="868" y1="242" y2="242" stroke="#30363d" stroke-dasharray="2 4"/><g class="r" style="animation-delay:0.5s"><text x="32" y="268" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="600">67 commits</text><text x="32" y="288" fill="#8b949e" font-size="10" letter-spacing=".08em" text-anchor="start">BUSIEST DAY</text><text x="32" y="304" fill="#6e7681" font-size="10" letter-spacing=".08em" text-anchor="start">Oct 29, 2026</text></g><g class="r" style="animation-delay:0.5700000000000001s"><text x="241" y="268" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="600">444,813 lines</text><text x="241" y="288" fill="#8b949e" font-size="10" letter-spacing=".08em" text-anchor="start">BIGGEST COMMIT</text><text x="241" y="304" fill="#6e7681" font-size="10" letter-spacing=".08em" text-anchor="start">Aug 26, 2026 · P20</text></g><g class="r" style="animation-delay:0.64s"><text x="450" y="268" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="600">12 h</text><text x="450" y="288" fill="#8b949e" font-size="10" letter-spacing=".08em" text-anchor="start">LONGEST SESSION</text><text x="450" y="304" fill="#6e7681" font-size="10" letter-spacing=".08em" text-anchor="start">Oct 29, 2026 · 65 commits</text></g><g class="r" style="animation-delay:0.71s"><text x="659" y="268" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="600">40 days</text><text x="659" y="288" fill="#8b949e" font-size="10" letter-spacing=".08em" text-anchor="start">LONGEST COMMIT STREAK</text><text x="659" y="304" fill="#6e7681" font-size="10" letter-spacing=".08em" text-anchor="start">consecutive days with commits</text></g>
</svg>