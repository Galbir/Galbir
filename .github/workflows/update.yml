name: Update profile stats
on:
  schedule: [{ cron: '17 3 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
concurrency: profile-stats
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch.mjs && node scripts/render.mjs
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }} # fine-grained PAT: Contents + Metadata read-only, all repos
          GH_LOGIN: ${{ github.repository_owner }}
          # optional, enables the "Recently played" card; leave unset to skip it
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets docs/data.json
          git diff --cached --quiet || (git commit -m "chore: update stats" && git push)
