name: Update profile stats
on:
  schedule: [{ cron: '17 3 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch.mjs && node scripts/render.mjs
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }} # classic PAT, `repo` scope (reads private repos)
          GH_LOGIN: ${{ github.repository_owner }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: update stats" && git push
